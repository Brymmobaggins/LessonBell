<!-- @format -->

<!doctype html>
<html lang="en" class="font-mono tracking-tight text-charcoal">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lessonBell</title>
    <link rel="stylesheet" href="/dist/output.css" />
  </head>
  <body>
    <main class="">
      <!-- SplashScreen -->
      <section
        id="splashScreen"
        class="min-h-screen flex items-center justify-center"
      >
        <div class="flex flex-col items-center">
          <div class="">
            <img
              src="/assests/img/logo.jpg"
              alt="Bell"
              class="w-20 h-20 object-contain"
            />
          </div>
          <div class="text-2xl sm:text-4xl font-normal">LessonBell</div>
          <div class="text-sm sm:text-base mt-4 text-gray-500">
            Never miss a lesson again
          </div>

          <div
            id="loadingBar"
            class="mt-52 h-3 bg-gray-500 w-40 rounded-full"
          ></div>

          <div
            id="loadingText"
            class="mt-3 text-base sm:text-sm tracking-widest"
          >
            loading ...0%
          </div>
        </div>
      </section>

      <!-- welcome screen -->
      <section
        id="welcomeScreen"
        class="hidden min-h-screen flex-col items-center justify-center px-6"
      >
        <div class="text-2xl sm:text-4xl">Welcome to lessonBell</div>
        <div class="text-sm sm:text-base mt-4 text-center text-gray-500">
          Your teaching period, never missed.
        </div>

        <button
          type="button"
          id="getStartedBtn"
          class="mt-8 rounded-xl bg-gray-800 px-8 py-4 text-white transition-colors duration-200 hover:bg-gray-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-gray-800 cursor-pointer"
        >
          Get Started
        </button>
      </section>

      <!-- Teacher Setup Screen -->
      <section
        id="teacherSetupScreen"
        class="hidden min-h-screen flex-col justify-center px-6"
      >
        <div class="mx-auto w-full max-w-md">
          <h1 class="text-2xl sm:text-4xl">Let's get to know you.</h1>

          <p class="mt-3 text-sm sm:text-base text-gray-500">
            Tell us a little about yourself to get started.
          </p>

          <form id="teacherSetupForm" onsubmit="return false" class="mt-10 space-y-4">
            <!-- Teacher Name -->
            <div>
              <label for="teacherName" class="block mb-1 text-sm">
                Your Name
              </label>

              <input
                type="text"
                id="teacherName"
                placeholder="e.g. Mr. Bakare"
                required
                class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-gray-800"
              />
            </div>

            <!-- School Name -->
            <div>
              <label for="schoolName" class="block mb-1 text-sm">
                School Name
              </label>

              <input
                type="text"
                id="schoolName"
                placeholder="Enter your school name"
                required
                class="w-full rounded-xl border border-gray-300 px-4 py-3 outline-none focus:border-gray-800"
              />
            </div>

            <button
              type="submit"
              class="w-full rounded-xl bg-gray-800 px-8 py-4 text-white hover:bg-gray-700 transition-colors"
            >
              Continue
            </button>
          </form>
        </div>
      </section>
    </main>

    <script defer src="./js/splash.js"></script>
  </body>
</html>
